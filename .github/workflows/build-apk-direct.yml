name: Build APK (GitHub, Expo hesabı gerekmez)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Disk alanı aç (önceki derleme "No space left on device" ile bitti)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm uninstall react-native-google-mobile-ads || true  # reklamlar kapalı
          npx expo install expo-notifications expo-auth-session expo-crypto expo-secure-store expo-keep-awake expo-battery expo-print expo-sharing expo-file-system expo-document-picker @react-native-google-signin/google-signin

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a > ../gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # D8 "WARNING" satirları zararsızdır, hata sanılmasın diye atlanır.
            { grep -vE "^WARNING:|D8: Invalid stack map" ../gradle.log | grep -E "FAILURE:|What went wrong|Execution failed|Task .* FAILED|^e: |error:|Could not|Unable to|Caused by" | awk '!seen[$0]++' | head -15; } | while IFS= read -r l; do echo "::error::${l:0:380}"; done
          fi
          df -h /
          exit $code

      - name: Gradle günlüğünü yükle (hata olsa da)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Planim-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: SHA parmak izlerini yazdır (Firebase'e eklenecek)
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for f in android/app/build/outputs/apk/release/*.apk; do
            echo "=== $f ==="
            "$APKSIGNER" verify --print-certs "$f" | grep -E "SHA-1|SHA-256" || true
          done
          echo "=== debug.keystore ==="
          keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1|SHA256" || true
