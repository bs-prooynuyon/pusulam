name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["ana"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait

      - name: Download APK artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(npx eas-cli@latest build:list --platform android --status finished --limit 1 --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s); console.log(x[0]?.artifacts?.buildUrl||'')})")
          test -n "$URL"
          curl -L "$URL" -o Planim.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Planim-APK
          path: Planim.apk
          if-no-files-found: error
